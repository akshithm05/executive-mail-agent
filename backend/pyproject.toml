[project]
name = "aeea-backend"
version = "0.1.0"
description = "AI Executive Email Assistant — backend: FastAPI, LangGraph/Claude email-triage agent, Postgres, Redis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
# A pragmatic, production-grade rule set.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "D",    # pydocstyle
    "RUF",  # ruff-specific rules
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "D107",  # __init__ args are documented in the class docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "D100", "D103", "D104"]  # asserts + test creds
"migrations/*" = ["D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q"
# Surface our own deprecations as errors, but tolerate third-party ones.
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::DeprecationWarning:httpx.*",
]
